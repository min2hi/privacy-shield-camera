# ============================================================
# LiteLLM Gateway Configuration
# Governance Pillar — Budget, Rate Limit, Multi-provider routing
# ============================================================

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"

  # Logging vào Langfuse để theo dõi chi phí từ dashboard
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
  langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY_APP"
  langfuse_host: "os.environ/LANGFUSE_HOST"

litellm_settings:
  # Không log thông tin nhạy cảm (Privacy Policy)
  redact_user_api_key_info: true
  drop_params: true           # Bỏ params không hỗ trợ thay vì báo lỗi
  set_verbose: false

# ──────────────────────────────────────────────────────────
# MODEL LIST — Các LLM có thể sử dụng
# ──────────────────────────────────────────────────────────
model_list:

  # Ollama local — MIỄN PHÍ, chạy trên máy (ưu tiên dùng khi phát triển)
  - model_name: "local/llama3.2"
    litellm_params:
      model: "ollama/llama3.2:3b"
      api_base: "http://host.docker.internal:11434"
    model_info:
      max_tokens: 8192

  - model_name: "local/qwen2.5"
    litellm_params:
      model: "ollama/qwen2.5:7b"
      api_base: "http://host.docker.internal:11434"
    model_info:
      max_tokens: 16384

  # Google Gemini — Giá rẻ nhất trong cloud, có tier miễn phí
  - model_name: "gemini/gemini-2.0-flash"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GEMINI_API_KEY"
    model_info:
      max_tokens: 8192

  - model_name: "gemini/gemini-2.5-pro"
    litellm_params:
      model: "gemini/gemini-2.5-pro"
      api_key: "os.environ/GEMINI_API_KEY"
    model_info:
      max_tokens: 65536

  # OpenAI — Dùng cho demo chất lượng cao
  - model_name: "openai/gpt-4o-mini"
    litellm_params:
      model: "gpt-4o-mini"
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      max_tokens: 16384

  - model_name: "openai/gpt-4o"
    litellm_params:
      model: "gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      max_tokens: 128000

  # --- Embedding Models (cho RAG) ---
  - model_name: "text-embedding-3-small"
    litellm_params:
      model: "text-embedding-3-small"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "local/nomic-embed-text"
    litellm_params:
      model: "ollama/nomic-embed-text"
      api_base: "http://host.docker.internal:11434"

# ──────────────────────────────────────────────────────────
# ROUTER SETTINGS — Cân bằng tải và fallback
# ──────────────────────────────────────────────────────────
router_settings:
  # Nếu Ollama local không trả lời trong 10s, fallback sang Gemini
  routing_strategy: "usage-based-routing"
  num_retries: 2
  timeout: 30

# ──────────────────────────────────────────────────────────
# BUDGET & RATE LIMIT (Governance)
# ──────────────────────────────────────────────────────────
# Virtual keys được tạo trong database, không cần cấu hình ở đây.
# Xem thêm: http://localhost:4000/ui để tạo key và set budget.
